<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Huawei Cloud DevSecOps CI/CD Platform Architecture</title>
  <desc id="desc">GitHub and CodeArts deliver verified container images through SWR to CCE, with AOM monitoring.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0f2440"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".3"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#60a5fa"/>
    </marker>
    <style>
      .title{font:700 42px Inter,Segoe UI,sans-serif;fill:#f8fafc}
      .subtitle{font:400 19px Inter,Segoe UI,sans-serif;fill:#94a3b8}
      .label{font:700 20px Inter,Segoe UI,sans-serif;fill:#f8fafc}
      .small{font:400 15px Inter,Segoe UI,sans-serif;fill:#cbd5e1}
      .box{fill:#12243c;stroke:#334b6b;stroke-width:2}
      .cloud{fill:#172b47;stroke:#ef4444;stroke-width:2}
      .line{fill:none;stroke:#60a5fa;stroke-width:4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="80" y="76" width="120" height="8" rx="4" fill="url(#accent)"/>
  <text x="80" y="145" class="title">Huawei Cloud DevSecOps CI/CD Platform</text>
  <text x="80" y="184" class="subtitle">Secure delivery • private images • controlled releases • observable workloads</text>

  <g filter="url(#shadow)">
    <rect class="box" x="90" y="320" width="230" height="150" rx="22"/>
    <text x="205" y="375" text-anchor="middle" class="label">GitHub</text>
    <text x="205" y="410" text-anchor="middle" class="small">Source &amp; pull requests</text>
    <text x="205" y="438" text-anchor="middle" class="small">Tests • CodeQL • Trivy</text>

    <rect class="box" x="390" y="320" width="250" height="150" rx="22"/>
    <text x="515" y="375" text-anchor="middle" class="label">CodeArts</text>
    <text x="515" y="410" text-anchor="middle" class="small">Build &amp; release pipeline</text>
    <text x="515" y="438" text-anchor="middle" class="small">Approval • rollback</text>

    <rect class="box" x="710" y="320" width="220" height="150" rx="22"/>
    <text x="820" y="375" text-anchor="middle" class="label">SWR</text>
    <text x="820" y="410" text-anchor="middle" class="small">Private images</text>
    <text x="820" y="438" text-anchor="middle" class="small">Immutable version tags</text>

    <rect class="cloud" x="1000" y="260" width="500" height="360" rx="32"/>
    <text x="1250" y="312" text-anchor="middle" class="label">Huawei Cloud CCE</text>
    <rect class="box" x="1050" y="355" width="180" height="120" rx="18"/>
    <text x="1140" y="402" text-anchor="middle" class="label">Catalog</text>
    <text x="1140" y="434" text-anchor="middle" class="small">Inventory API</text>
    <rect class="box" x="1270" y="355" width="180" height="120" rx="18"/>
    <text x="1360" y="402" text-anchor="middle" class="label">Orders</text>
    <text x="1360" y="434" text-anchor="middle" class="small">Idempotent API</text>
    <rect class="box" x="1050" y="510" width="400" height="70" rx="18"/>
    <text x="1250" y="553" text-anchor="middle" class="small">Helm • HPA • PDB • NetworkPolicy</text>

    <rect class="box" x="1010" y="700" width="480" height="110" rx="22"/>
    <text x="1250" y="747" text-anchor="middle" class="label">AOM &amp; Cloud Native Monitoring</text>
    <text x="1250" y="780" text-anchor="middle" class="small">Health • metrics • alarms • release verification</text>
  </g>

  <path class="line" d="M320 395 H380"/>
  <path class="line" d="M640 395 H700"/>
  <path class="line" d="M930 395 H990"/>
  <path class="line" d="M1250 620 V690"/>
  <path class="line" d="M1270 415 H1240"/>

  <text x="80" y="850" class="small">Portfolio reference architecture • credentials and account identifiers intentionally excluded</text>
</svg>

