{{- if .Values.catalog.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "commerce-platform.fullname" . }}-catalog
  labels:
    {{- include "commerce-platform.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "commerce-platform.fullname" . }}-catalog
  minReplicas: {{ .Values.catalog.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.catalog.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.catalog.autoscaling.targetCPUUtilizationPercentage }}
---
{{- end }}
{{- if .Values.orders.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "commerce-platform.fullname" . }}-orders
  labels:
    {{- include "commerce-platform.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "commerce-platform.fullname" . }}-orders
  minReplicas: {{ .Values.orders.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.orders.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.orders.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}

