apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "commerce-platform.fullname" . }}-catalog
  labels:
    {{- include "commerce-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: catalog
spec:
  {{- if not .Values.catalog.autoscaling.enabled }}
  replicas: {{ .Values.catalog.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: catalog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "commerce-platform.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: catalog
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "commerce-platform.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: catalog
          image: "{{ .Values.catalog.image.repository }}:{{ .Values.catalog.image.tag }}"
          imagePullPolicy: {{ .Values.catalog.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.catalog.service.targetPort }}
              protocol: TCP
          env:
            - name: CATALOG_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "commerce-platform.fullname" . }}-config
                  key: environment
            - name: CATALOG_SEED_DATA
              valueFrom:
                configMapKeyRef:
                  name: {{ include "commerce-platform.fullname" . }}-config
                  key: catalog-seed-data
            - name: CATALOG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.existingSecret }}
                  key: catalog-database-url
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.catalog.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi

