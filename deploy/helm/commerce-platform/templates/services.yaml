apiVersion: v1
kind: Service
metadata:
  name: {{ include "commerce-platform.fullname" . }}-catalog
  labels:
    {{- include "commerce-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: catalog
spec:
  type: {{ .Values.catalog.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: catalog
  ports:
    - name: http
      port: {{ .Values.catalog.service.port }}
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "commerce-platform.fullname" . }}-orders
  labels:
    {{- include "commerce-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: orders
spec:
  type: {{ .Values.orders.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: orders
  ports:
    - name: http
      port: {{ .Values.orders.service.port }}
      targetPort: http
      protocol: TCP

