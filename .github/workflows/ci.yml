name: Continuous Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            services/*/requirements.lock

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.lock

      - name: Lint
        run: ruff check .

      - name: Verify formatting
        run: ruff format --check .

      - name: Run test suite
        run: pytest

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14

  deployment-config:
    name: Deployment configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: |
          helm lint deploy/helm/commerce-platform
          helm lint deploy/helm/commerce-platform -f deploy/helm/commerce-platform/values-dev.yaml
          helm lint deploy/helm/commerce-platform -f deploy/helm/commerce-platform/values-staging.yaml
          helm lint deploy/helm/commerce-platform -f deploy/helm/commerce-platform/values-prod.yaml

      - name: Render production manifests
        run: |
          helm template commerce-platform deploy/helm/commerce-platform \
            --namespace commerce-prod \
            --values deploy/helm/commerce-platform/values-prod.yaml \
            > /tmp/commerce-platform.yaml
          test -s /tmp/commerce-platform.yaml

  terraform:
    name: Terraform validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize without backend
        run: terraform init -backend=false

      - name: Validate configuration
        run: terraform validate
